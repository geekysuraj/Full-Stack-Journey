<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,tr,td,th {
         border: 1px solid black;
         border-collapse: collapse;
        }
    </style>
</head>
<body>
    <diV>
        <h1>Tables</h1>
        <table>
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>
        <table>
            <h2> Students Scores</h2>
            <table>
                <thread>
                    <tr>
                     <th>Student/Subject</th>
                    <th>Maths</th>
                    <th>Hindi</th>
                    <th>English</th>
                    <th>Science</th> 
                    </tr>
                </thread>
                <tr></tr>
                <tr>
                    <td>Anu</td>
                    <td>90</td>
                    <td>70</td>
                    <td>50</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td>Bhavya</td>
                    <td>67</td>
                    <td>78</td>
                    <td>90</td>
                    <td>60</td>
                </tr>
                <tr>
                   <td>Sumit</td>
                   <td>78</td>
                   <td>90</td>
                   <td>67</td>
                   <td>90</td>
                </tr>
                <tr>

                </tr>
                <caption>Student Scores</caption>
            </table>
        </table>
    </diV>
</body>
</html>
